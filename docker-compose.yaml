services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://epochforge:epochforge_secret@db:5432/epochforge
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-8f7b3d1e9a2c4e6b8f7b3d1e9a2c4e6b}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://epochforge.markenjaden.de}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-epochforge-secret-key-32bytes-long-}
      - ORIGIN=${ORIGIN:-https://epochforge.markenjaden.de}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: epochforge
      POSTGRES_PASSWORD: epochforge_secret
      POSTGRES_DB: epochforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epochforge -d epochforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
